name: Builder 👷

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 0" # Weekly
  workflow_dispatch:

permissions: {}

env:
  # Shared by the build upload step and the release publish step, so a new
  # target is added once instead of in two places.
  RELEASE_ARTEFACTS: |
    release/*.AppImage
    release/*.deb
    release/*.rpm
    release/latest-linux.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-gate:
    name: Version Gate 🔖
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Validate version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PKG_VERSION" != "$TAG_VERSION" ]]; then
            echo "Error: package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi
          echo "✓ Version $PKG_VERSION matches tag $TAG_VERSION"

  lint-code:
    name: Lint Code 🧹
    needs: [version-gate]
    # version-gate runs on tags only, so it is skipped on every other run, and
    # always() is what lets this job proceed past that skip. lint-actions,
    # test-config and test-code repeat this line because Actions cannot share
    # an `if` between jobs. The build job has its own condition, below.
    if: always() && (needs.version-gate.result == 'success' || needs.version-gate.result == 'skipped')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Type-check
        run: npx tsc --noEmit
      - name: Type-check tests
        run: npx tsc -p tsconfig.test.json --noEmit

  lint-actions:
    name: Lint Action ⚙️
    needs: [version-gate]
    if: always() && (needs.version-gate.result == 'success' || needs.version-gate.result == 'skipped')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: freerangebytes/setup-actionlint@v0.1.2
      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          actionlint -color

  test-config:
    name: Test Config 🧪
    needs: [version-gate]
    if: always() && (needs.version-gate.result == 'success' || needs.version-gate.result == 'skipped')
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Validate build config
        run: node scripts/validate-build-config.cjs
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The audit gate covers registry dependencies that ship. A package that ships
      # from devDependencies, as electron does, falls outside it.
      - name: Audit dependencies
        run: npm audit --omit=dev

  test-code:
    name: Test Code 🧪
    needs: [version-gate]
    if: always() && (needs.version-gate.result == 'success' || needs.version-gate.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Run unit tests
        run: npm test

  sentinel:
    name: Sentinel 👁️
    needs: [lint-code, lint-actions, test-config, test-code, build]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Check results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Job results: ${results}"
          if echo "${results}" | jq -e 'any(. == "failure" or . == "cancelled" or . == "skipped")' > /dev/null 2>&1; then
            echo "One or more jobs failed, were cancelled, or were skipped"
            exit 1
          fi
          echo "All jobs passed"

  build:
    name: Build (${{ matrix.os }})
    needs: [lint-code, lint-actions, test-config, test-code]
    # EVS secrets exist only in release-evs, whose deployment policy admits
    # version tags. A pull request uses ci, which carries no EVS secrets.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release-evs' || 'ci' }}
    # Every part of this is needed. Actions propagates the skipped version-gate
    # down the needs graph, and the four jobs above override it with their own
    # always(), so without always() here the skip reaches this job through them.
    # The four success checks are needed alongside it, because always() also
    # runs the job when a dependency failed. Do not delete this as redundant:
    # someone did, and the whole build matrix was skipped and Sentinel failed.
    if: >-
      always()
      && needs.lint-code.result == 'success'
      && needs.lint-actions.result == 'success'
      && needs.test-config.result == 'success'
      && needs.test-code.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # These flags decide the Linux targets, because a command-line target
          # overrides the config. package.json build.linux.target is the
          # fallback for a bare electron-builder run, which nothing here
          # performs. Tonic is Linux-first: the macOS and Windows legs went
          # with the snap pipeline (macOS has Apple's own client, tag builds
          # for both need EVS VMP signing secrets this fork does not carry,
          # and the sidra Snap Store name belongs upstream); restore them from
          # upstream's builder.yml if that changes.
          - os: linux
            runner: ubuntu-24.04
            targets: "--linux AppImage deb rpm"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin rpm
      - name: Compile TypeScript
        run: npm run build
        env:
          SIDRA_LASTFM_API_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SIDRA_LASTFM_API_KEY || '' }}
          SIDRA_LASTFM_API_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.SIDRA_LASTFM_API_SECRET || '' }}
      - name: Build distributables
        run: npx electron-builder --publish never ${{ matrix.targets }}
        env:
          EVS_ACCOUNT_NAME: ${{ startsWith(github.ref, 'refs/tags/') && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.EVS_PASSWD || '' }}
      - name: Upload artefacts
        uses: actions/upload-artifact@v7
        with:
          name: sidra-${{ matrix.os }}
          path: ${{ env.RELEASE_ARTEFACTS }}
          retention-days: 7

  release:
    name: Release 📦
    needs: [sentinel, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.sentinel.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check release does not already exist
        run: |
          set -euo pipefail
          release_tags=$(gh release list --repo "$GH_REPO" --limit 10000 --json tagName --jq '.[].tagName') || {
            echo "Error: failed to query releases for $GH_REPO" >&2
            exit 1
          }
          if printf '%s\n' "$release_tags" | grep -Fxq "$RELEASE_TAG"; then
            echo "Error: release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG does not exist in $GH_REPO"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all build artefacts
        uses: actions/download-artifact@v8
        with:
          path: release/
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ env.RELEASE_ARTEFACTS }}

  nix-hash:
    name: Nix Hash 🔑
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: DeterminateSystems/determinate-nix-action@v3.21.8
        with:
          extra-conf: |
            eval-cores = 0
      - name: Update Nix hashes 📝
        run: |
          set -euo pipefail

          PKG_VERSION="${GITHUB_REF_NAME#v}"
          # Literal Nix interpolation, not a shell expansion.
          # shellcheck disable=SC2016
          NIX_VERSION='${version}'

          # The artifactName template in package.json decides these filenames and
          # nothing in the repository restates it, so the published release is the
          # only authority on them. Both the prefetch and the URL written into the
          # Nix files come from the assets it lists.
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets')

          # Resolve one asset download URL, refusing zero matches or several.
          asset_url() {
            local pattern="$1" urls count
            urls=$(printf '%s' "$assets" | jq -r --arg p "$pattern" '.[] | select(.name | test($p)) | .url')
            count=$(printf '%s\n' "$urls" | grep -c '.' || true)
            if [[ "${count}" -ne 1 ]]; then
              echo "::error::Expected 1 release asset matching /${pattern}/, found ${count}" >&2
              return 1
            fi
            printf '%s' "$urls"
          }

          # Write the URL and its hash together, so the two can never disagree.
          # The URL goes back version-templated, keeping the Nix files tied to
          # package.json: a hash left stale then fails loudly instead of serving
          # an older release under the new version number.
          update_nix() {
            local file="$1" url="$2" hash="$3" nix_url
            # This is the only point at which the Nix files are written, so it
            # is where a resolution that produced nothing has to stop. Do not
            # rely on errexit alone to have caught that further up: a job that
            # runs at release time only is checked by users, not by CI.
            if [[ -z "${url}" || "${hash}" != sha256-* ]]; then
              echo "::error::${file}: refusing to write url '${url}' and hash '${hash}'" >&2
              return 1
            fi
            nix_url="${url//${PKG_VERSION}/${NIX_VERSION}}"
            sed -i \
              -e "s|^\([[:space:]]*\)url = \"[^\"]*\";|\1url = \"${nix_url}\";|" \
              -e "s|^\([[:space:]]*\)hash = \"sha256-[^\"]*\";|\1hash = \"${hash}\";|" \
              "${file}"
            grep -Fq "url = \"${nix_url}\";" "${file}" || {
              echo "::error::${file}: url not rewritten to ${nix_url}" >&2
              return 1
            }
            grep -Fq "hash = \"${hash}\";" "${file}" || {
              echo "::error::${file}: hash not rewritten to ${hash}" >&2
              return 1
            }
          }

          # One deb is built; nix/linux.nix takes its URL and hash. The darwin
          # update went with the macOS build leg: Tonic is Linux-first.
          linux_url=$(asset_url '\.deb$')

          echo "⬇️  Fetching Linux deb: ${linux_url}"
          linux_hash=$(nix store prefetch-file --json --hash-type sha256 "${linux_url}" | jq -r '.hash')
          echo "🔑 Linux hash: ${linux_hash}"

          update_nix nix/linux.nix "${linux_url}" "${linux_hash}" || exit 1

          echo "✅ Updated nix/linux.nix"
          git diff nix/linux.nix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR with hash updates 🚀
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BRANCH="ci/nix-hash-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add nix/linux.nix
          git commit -m "chore(nix): update hashes for v${VERSION}"
          git push origin "${BRANCH}"

          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(nix): update hashes for v${VERSION}" \
            --body "Update Nix package hashes for the ${VERSION} release.")

          echo "Created PR: ${PR_URL}"
          gh pr merge "${PR_URL}" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
