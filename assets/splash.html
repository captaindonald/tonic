<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<link rel="stylesheet" href="windowChrome.css">
<style>
/* windowChrome.css sizes .icon to a 128px square for the about window's mark.
   The splash carries the wide lockup, so it overrides both axes here rather
   than in the shared sheet, which would stretch the about window's icon. */
.icon {
  width: 480px;
  height: 230px;
  margin-bottom: 24px;
}
.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(218, 165, 32, 0.2);
  border-top-color: #daa520;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loading-text {
  color: rgba(218, 165, 32, 0.7);
  font-size: 13px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<img class="icon" src="tonic-lockup.png" alt="" width="480" height="230">
<div class="spinner"></div>
<span class="loading-text">Loading...</span>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var text = params.get('text') || 'Loading...';
  var lang = params.get('lang') || '';
  document.title = text;
  document.querySelector('.loading-text').textContent = text;
  if (lang === 'ar' || lang === 'he') {
    document.dir = 'rtl';
  }
})();
</script>
</body>
</html>
